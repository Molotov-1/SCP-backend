spring.application.name=scp
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Base de datos (Neon en producción / local en desarrollo)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

springdoc.swagger-ui.path=/doc/swagger-ui/index.html
springdoc.api-docs.path=/api-docs

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:5173,http://localhost:3000,http://localhost:4200,https://scp-react-zk1p-nine.vercel.app}